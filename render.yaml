# Blueprint triển khai Render Static Site cho Bản Thảo Chu Sa (Pure Client-Side SPA)
version: "1"
services:
  - type: web
    name: api-dich-truyen
    runtime: static
    repo: https://github.com/caoduongle/API_dich_truyen
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit

    # Quản lý biến môi trường (sync: false để giữ nguyên giá trị đã lưu an toàn trên Render)
    envVars:
      - key: VITE_GOOGLE_PICKER_API_KEY
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_GOOGLE_APP_ID
        sync: false

    # SPA Rewrite Rule: Điều hướng toàn bộ Deep-link về /index.html để tránh lỗi 404 khi F5
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      # 1. Chống MIME-sniffing
      - path: /*
        name: X-Content-Type-Options
        value: nosniff

      # 2. Ngăn chặn clickjacking (chặn nhúng iframe từ bên ngoài)
      - path: /*
        name: X-Frame-Options
        value: DENY

      # 3. Bảo vệ referrer khi điều hướng ra domain ngoài
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

      # 4. Cho phép popup đăng nhập Google Identity Services (GIS) giao tiếp với trang mẹ
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin-allow-popups

      # 5. Ngăn chặn các website khác đọc trộm tài nguyên tĩnh (code/assets)
      - path: /*
        name: Cross-Origin-Resource-Policy
        value: same-origin

      # 6. Vô hiệu hóa các quyền phần cứng không dùng (bảo vệ thiết bị người dùng)
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=(), usb=(), screen-wake-lock=()

      # 7. Bắt buộc HTTPS trong 1 năm
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains; preload

      # 8. Chính sách an ninh nội dung (Content-Security-Policy)
      # - Tự động nâng cấp mọi request HTTP thành HTTPS (upgrade-insecure-requests).
      # - script-src: Đã loại bỏ hoàn toàn 'unsafe-inline' sau khi kiểm chứng thực nghiệm qua 4 luồng
      #   (tải trang/JSON-LD, GIS Auth, Google Picker, Custom Theme); chỉ cấp quyền cho 'self' và
      #   các endpoint SDK chính thức của Google (apis.google.com, accounts.google.com).
      # - style-src: Bắt buộc giữ lại 'unsafe-inline' vì 3 lý do thực nghiệm đã xác thực qua DevTools:
      #   1) Core App React sử dụng inline style attributes động (bảng màu CustomThemeModal, thanh tiến
      #      trình, chiều cao virtual scroll list) không thể gắn hash tĩnh;
      #   2) Google Identity Services (accounts.google.com/gsi/client) tự động chèn thẻ <style> động;
      #   3) Google Drive Picker (gapi.load) tự động chèn thẻ <style> động khi khởi tạo giao diện.
      # - connect-src: Đã loại bỏ hoàn toàn ws: và wss: (Zero-Backend); cấp phép cho Gemini AI, Google Drive,
      #   và https://zuminovel.com phục vụ đăng chương.
      - path: /*
        name: Content-Security-Policy
        value: "upgrade-insecure-requests; default-src 'self'; script-src 'self' https://apis.google.com https://accounts.google.com; style-src 'self' 'unsafe-inline' https://accounts.google.com https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: *.googleusercontent.com; connect-src 'self' https://generativelanguage.googleapis.com https://www.googleapis.com https://accounts.google.com https://content.googleapis.com https://oauth2.googleapis.com https://apis.google.com https://zuminovel.com; frame-src https://drive.google.com https://docs.google.com https://accounts.google.com https://content.googleapis.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';"