name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Secret leak pattern detection
        run: |
          echo "Scanning for hardcoded Gemini API keys..."
          if grep -r --exclude-dir={node_modules,.git,dist} -E "AIza[0-9A-Za-z\\-_]{35}" . ; then
            echo "ERROR: Potential hardcoded Gemini API key detected in source files!"
            exit 1
          fi
          echo "No hardcoded keys detected."

      - name: Type check
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
