name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Secret leak pattern detection
        run: |
          echo "Scanning for hardcoded Gemini API keys in source files..."
          if grep -r \
            --exclude-dir=node_modules \
            --exclude-dir=.git \
            --exclude-dir=dist \
            --exclude-dir=specs \
            --exclude-dir=__tests__ \
            --exclude-dir=tests \
            --exclude-dir=.specify \
            --exclude="*.test.*" \
            --exclude="*.spec.*" \
            --exclude="*.contract.md" \
            -E "AIza[0-9A-Za-z\\-_]{35}" . ; then
            echo "ERROR: Potential hardcoded Gemini API key detected in source files!"
            exit 1
          fi
          echo "No hardcoded keys detected."

      - name: Type check
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test
